<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/images/logo.png">
  <title>Staff Login (Agent &amp; Manager) | PIGEM</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="simple-bar">
    <div class="container">
      <img data-img="logo.png" src="assets/images/logo.png" alt="Logo">
      <b>PIGEM Internal Staff Portal</b>
    </div>
  </header>

  <main class="auth-page">
    <div class="card auth-card">
      <div class="center">
        <span class="tag">Subsystem 2 &mdash; Agent &amp; Manager</span>
        <h2 class="mt">Staff Sign In</h2>
        <p class="small muted mt">Sign in with your Agent or Manager account. The system will open your assigned workspace automatically.</p>
      </div>

      <form class="mt-big" onsubmit="handleLogin(event)">
        <div>
          <label for="email">Staff Email Address</label>
          <input id="email" type="email" placeholder="agent@pigem.local or manager@pigem.local" required>
        </div>

        <div class="mt">
          <div class="row between">
            <label for="password" style="margin:0">Password</label>
            <a href="#" class="small" style="color:var(--red); font-weight:600;" onclick="openForgotModal(); return false;">Forgot Password?</a>
          </div>
          <input id="password" type="password" class="mt" placeholder="Enter your password" required>
        </div>

        <!-- Always-Working Captcha Widget -->
        <div id="login-captcha-box" class="mt"></div>

        <div class="mt-big">
          <button id="btn-login" type="submit" class="btn btn-red btn-full">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
